# Free Hugging Face Spaces sleep after 48 hours with no traffic, and the first
# visitor after that waits for the container to come back. This pings the Space
# twice a day so the timer never expires.
#
# Set SPACE_URL below to your Space, then enable Actions on the repo. Delete
# this file if you would rather let the Space sleep: a sleeping Space costs
# nothing and only the first visitor after a quiet spell is affected.
name: Keep Space awake

on:
  schedule:
    - cron: "0 6,18 * * *"  # 06:00 and 18:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space
        env:
          SPACE_URL: https://huggingface.co/spaces/ai-vaibhavv/GeoLocator
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 -L "$SPACE_URL")
          echo "$SPACE_URL -> $code"
          # A sleeping Space answers while it wakes, so treat any 2xx/3xx as fine
          # and only fail the job on a real error.
          case "$code" in
            2*|3*) echo "Space is reachable" ;;
            *) echo "Unexpected status $code"; exit 1 ;;
          esac
